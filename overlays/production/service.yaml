  labels:
    cloud.googleapis.com/location: asia-southeast2
spec:
  template:
    metadata:
      annotations:
        ## Example configuration for attching service to VPC Network
        # run.googleapis.com/vpc-access-egress: private-ranges-only
        # run.googleapis.com/network-interfaces: '[{"network":"poc-dev-sandbox-vpc","subnetwork":"poc-dev-sandbox-jkt-sub"}]'
    spec:
      ## TODO: Uncomment the following line to define service account
      ## used by the service. If not set cloud run service will use
      ## default compute engine service account in deployment project
      # serviceAccountName: PROJECT_NUMBER-compute@developer.gserviceaccount.com
      containers:
        - image: us-docker.pkg.dev/cloudrun/container/hello # Will be replaced by CI/CD Pipeline
          env:
            - name: ENV
              value: development # TODO: update ENV value when needed


            ## Example Secret Environment
            # for secrets in the same project as deployment project
            # - name: EXAMPLE_SECRET
            #   valueFrom:
            #     secretKeyRef:
            #       key: "[VERSION]"  # example: "3"
            #       name: [SECRET_NAME]
